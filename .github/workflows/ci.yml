# ═════════════════════════════════════════════════════════════════
# CI 流水线：lint → 单元测试（带覆盖率门槛）→ 离线评估门禁 → Docker 镜像构建
#
# 设计要点：
#   - Python 3.10 / 3.12 双版本矩阵（requires-python 下限 + 开发环境版本）
#   - 测试全程零外部依赖：hash 嵌入 + inprocess 队列 + rule 评估（见 tests/conftest.py）
#   - 覆盖率门槛 30%：当前仅核心模块有单测（检索/技能管理/队列/API），
#     LLM 相关路径需要真实 Key，由集成环境覆盖——门槛随覆盖扩张逐步上调
#   - eval-gate 离线评估门禁：evals/gate.py 用 golden_pairs.json 金标对实测
#     评估器判别力（good_pass_rate / bad_block_rate 对比 thresholds.json 阈值），
#     防止改动评估器规则导致判分能力静默回退；门禁失败阻断 Docker 构建
#   - Docker 构建使用 GHA 层缓存，仅在测试与门禁全部通过后执行
# ═════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  eval-gate:
    name: Eval gate (离线评估门禁)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline eval gate
        run: python evals/gate.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, eval-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bp-monitor-service-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
